<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" /> <!-- slate-900 / dark blue -->
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- C shape -->
  <path d="M280 140 A 130 130 0 1 0 280 372" fill="none" stroke="url(#icon-grad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)" />

  <!-- Growth Arrow -->
  <path d="M190 280 L 320 150 L 320 230 M 320 150 L 240 150" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>